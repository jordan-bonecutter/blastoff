# Copy to ~/.config/blastoff/config.toml. All settings are optional.
width = 680.0
max_results = 7
font_size = 17.0
radius = 20.0
# 1 = opaque; lower values show more of the desktop.
opacity = 0.92
# Request native backdrop blur where the compositor supports it.
blur = true
background = "#202020"
foreground = "#eeeeee"
accent = "#d4d4d4"
icon_theme = "Adwaita"
terminal = ["foot", "-e"]
close_on_unfocus = true
